name: Build Llamatik (PrismML fork, NEON 1-bit)

# Construit une AAR Android de Llamatik depuis les SOURCES, mais en pointant
# le sous-module llama.cpp vers LE FORK de PrismML (PrismML-Eng/llama.cpp,
# branche "prism") plutot que l'upstream officiel (ggml-org/llama.cpp).
#
# Pourquoi : Bonsai 27B (voir LocalModelCatalog.kt, task #318) est publie au
# format GGUF Q1_0_g128 (1-bit natif, groupe 128) -- un type ggml PROPRE au
# fork PrismML, absent de llama.cpp upstream. Sans ce fork, Llamatik (et
# donc Jarvis2) ne dispose d'AUCUN noyau optimise pour ce format : au mieux
# un chargement qui echoue proprement, au pire une deqantification generique
# lente qui n'offre aucun des gains de vitesse annonces par PrismML.
#
# Verifie avant de lancer ce chantier (voir task #323/#324) : PrismML-Eng/
# llama.cpp PR #8 ("some cpu fixes... Add NEON CPU") est MERGEE dans la
# branche "prism" et inclut un noyau ARM NEON pour Q1_0_g128, valide par
# divergence KL quasi nulle vs la reference F16 -- donc CPU pur (pas besoin
# de Vulkan : PR #9, le support Vulkan/Android pour ce format, est FERMEE
# et jamais mergee -- sans elle Vulkan retomberait de toute facon sur la
# meme dequantification CPU generique lente).
#
# Contrairement a build-llamatik-vulkan.yml, PAS de plomberie Vulkan/SPIRV
# (pas de SDK LunarG, pas de copie de headers) : build CPU standard, donc
# nettement plus simple/rapide.
#
# Comme build-llamatik-vulkan.yml : ne touche RIEN au code Kotlin des
# autres modeles (Qwen/Phi/Dolphin/Gemma4/LFM restent sur des
# quantifications Q4_K_M standards, totalement inchangees et non affectees
# par les ajouts bas-niveau du fork) -- seule la lib native partagee change
# de source de compilation. Volontairement separe du CI principal (meme
# raison que build-llamatik-vulkan.yml : compilation C++ longue).
#
# Resultat commite sur une branche dediee (jamais main) -- a fusionner
# manuellement une fois l'AAR verifiee (build + assemblage app OK ; la
# verification finale de la vitesse/correction reelle de l'inference ne
# peut se faire que sur un vrai telephone, pas dans ce CI).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-bonsai-aar:
    name: Build Llamatik Android AAR (PrismML fork, CPU/NEON)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Jarvis2
        uses: actions/checkout@v4
        with:
          path: jarvis2

      - name: Checkout Llamatik (with submodules)
        uses: actions/checkout@v4
        with:
          repository: ferranpons/llamatik
          ref: v1.10.1
          submodules: recursive
          path: llamatik-src

      - name: Remplacer le sous-module llama.cpp par le fork PrismML (branche prism)
        working-directory: llamatik-src/llama.cpp
        run: |
          set -e
          echo "--- Commit llama.cpp AVANT remplacement (upstream ggml-org) ---"
          git log -1 --oneline
          git remote add prism https://github.com/PrismML-Eng/llama.cpp.git
          git fetch --depth=1 prism prism
          git checkout FETCH_HEAD
          echo "--- Commit llama.cpp APRES remplacement (fork PrismML, branche prism) ---"
          git log -1 --oneline
          git submodule update --init --recursive

      - name: Patcher le wrapper C++ Llamatik pour l'API du fork PrismML (branche prism)
        # Llamatik v1.10.1 vendorise son propre code C++ (multimodal_jni.cpp,
        # llama_embed.cpp) ecrit contre l'API llama.cpp UPSTREAM au moment de
        # cette release. La branche "prism" du fork PrismML a fait deriver
        # cette API (voir task #324) :
        #   1) llama_sampler_init_penalties() prend desormais n_vocab en 1er
        #      argument (5 args au lieu de 4) -- 8 sites d'appel a corriger.
        #   2) llama_model_params n'a plus les bool use_mmap/use_mlock,
        #      fusionnes dans un unique enum load_mode -- 2 sites a corriger.
        #   3) common/json_schema_to_grammar() attend maintenant un
        #      common_json (nouveau wrapper JSON maison du fork) et non plus
        #      un nlohmann::json brut -- 1 site a corriger.
        # Patch applique sur la copie FRAICHEMENT clonee de Llamatik (jamais
        # sur le fork lui-meme), donc sans consequence pour les autres
        # utilisateurs de Llamatik ni pour les autres moteurs IA de Jarvis2.
        run: |
          set -e
          python3 - <<'PYEOF'
          import re, pathlib

          embed_path = pathlib.Path("llamatik-src/library/src/commonMain/cpp/llama_embed.cpp")
          text = embed_path.read_text()

          # 1) json_schema_to_grammar attend un common_json, plus un nlohmann::json brut.
          pat1 = re.compile(r"nlohmann::ordered_json\s+schema\s*=\s*nlohmann::ordered_json::parse\(schema_str\);")
          text, n1 = pat1.subn("common_json schema = common_json::parse(schema_str);", text)
          assert n1 == 1, f"json_schema_to_grammar: attendu 1 occurrence, trouve {n1}"

          # 2) use_mmap/use_mlock fusionnes dans load_mode (fallback CPU-only apres echec de chargement).
          pat2 = re.compile(r"[ \t]*mp\.use_mmap\s*=\s*false;\n[ \t]*mp\.use_mlock\s*=\s*false;\n")
          text, n2 = pat2.subn("    mp.load_mode    = LLAMA_LOAD_MODE_NONE;\n", text)
          assert n2 == 2, f"use_mmap/use_mlock (fallback): attendu 2 occurrences, trouve {n2}"

          # 2b) meme fusion pour le chargement du modele MTP (piloté par g_use_mmap).
          pat3 = re.compile(r"mparams\.use_mmap\s*=\s*g_use_mmap\.load\(std::memory_order_relaxed\);")
          text, n3 = pat3.subn(
              "mparams.load_mode    = g_use_mmap.load(std::memory_order_relaxed) ? LLAMA_LOAD_MODE_MMAP : LLAMA_LOAD_MODE_NONE;",
              text,
          )
          assert n3 == 1, f"use_mmap (MTP): attendu 1 occurrence, trouve {n3}"

          # 3) llama_sampler_init_penalties: +1 argument n_vocab en tete (7 sites dans ce fichier).
          pat4 = re.compile(r"llama_sampler_init_penalties\(-1, repeat_penalty, 0\.0f, 0\.10f\)")
          text, n4 = pat4.subn(
              "llama_sampler_init_penalties(llama_vocab_n_tokens(llama_model_get_vocab(gen_model)), -1, repeat_penalty, 0.0f, 0.10f)",
              text,
          )
          assert n4 == 7, f"llama_sampler_init_penalties (llama_embed.cpp): attendu 7 occurrences, trouve {n4}"

          embed_path.write_text(text)
          print("llama_embed.cpp patche avec succes (%d+%d+%d+%d correctifs)" % (n1, n2, n3, n4))

          mjni_path = pathlib.Path("llamatik-src/library/src/commonMain/cpp/multimodal_jni.cpp")
          mtext = mjni_path.read_text()
          pat5 = re.compile(r"llama_sampler_init_penalties\(128, 1\.10f, 0\.0f, 0\.10f\)")
          mtext, n5 = pat5.subn(
              "llama_sampler_init_penalties(llama_vocab_n_tokens(vocab), 128, 1.10f, 0.0f, 0.10f)",
              mtext,
          )
          assert n5 == 1, f"llama_sampler_init_penalties (multimodal_jni.cpp): attendu 1 occurrence, trouve {n5}"
          mjni_path.write_text(mtext)
          print("multimodal_jni.cpp patche avec succes (%d correctif)" % n5)

          cmake_path = pathlib.Path("llamatik-src/library/src/commonMain/cpp/CMakeLists.txt")
          ctext = cmake_path.read_text()
          anchor = "        ${MTMD_DIR}/models/youtuvl.cpp\n"
          assert ctext.count(anchor) == 1, f"CMakeLists.txt: ancre youtuvl.cpp trouvee {ctext.count(anchor)} fois (attendu 1)"
          new_models = [
              "dots3note.cpp",
              "mimo-audio.cpp",
              "minimax-m3.cpp",
              "muse-glimmer.cpp",
              "parakeet.cpp",
              "pockettts-gen.cpp",
              "pockettts-seanet.cpp",
              "pockettts-spkenc.cpp",
              "qwen3tts-gen.cpp",
              "qwen3tts-spkenc.cpp",
          ]
          insertion = "".join(f"        ${{MTMD_DIR}}/models/{m}\n" for m in new_models)
          ctext = ctext.replace(anchor, anchor + insertion, 1)
          # hash_sha256_hex() (utilise par mtmd-helper.cpp, deja dans la liste) vit
          # desormais dans un vendor/hash/ tout neuf, absent de la liste Llamatik.
          hash_anchor = "        ${MTMD_DIR}/deprecation-warning.cpp\n"
          assert ctext.count(hash_anchor) == 1, f"CMakeLists.txt: ancre deprecation-warning.cpp trouvee {ctext.count(hash_anchor)} fois (attendu 1)"
          hash_insertion = (
              "        ${LLAMA_CPP_DIR}/vendor/hash/hash.cpp\n"
              "        ${LLAMA_CPP_DIR}/vendor/hash/sha256/sha256.c\n"
          )
          ctext = ctext.replace(hash_anchor, hash_insertion + hash_anchor, 1)
          cmake_path.write_text(ctext)
          print("CMakeLists.txt patche avec succes (%d nouveaux fichiers models/*.cpp + 2 fichiers vendor/hash ajoutes)" % len(new_models))

          PYEOF


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses (NDK auto-provisioning)
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Restrict native build to arm64-v8a only (faster CI build)
        run: |
          sed -i 's/abiFilters += setOf("arm64-v8a", "armeabi-v7a", "x86_64", "x86")/abiFilters += setOf("arm64-v8a")/' llamatik-src/library/build.gradle.kts
          grep -n "abiFilters" llamatik-src/library/build.gradle.kts

      - name: Build Llamatik Android library AAR (CPU backend, fork PrismML)
        working-directory: llamatik-src
        run: ./gradlew :library:assembleRelease --stacktrace

      - name: Locate the built AAR
        id: locate
        run: |
          AAR_PATH=$(find llamatik-src/library/build/outputs/aar -name "*.aar" | head -n 1)
          if [ -z "$AAR_PATH" ]; then
            echo "::error::Aucune AAR trouvee sous llamatik-src/library/build/outputs/aar"
            exit 1
          fi
          echo "aar_path=$AAR_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$AAR_PATH"

      - name: Upload AAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamatik-bonsai-aar
          path: ${{ steps.locate.outputs.aar_path }}
          retention-days: 30

      - name: Commit AAR to a dedicated branch in Jarvis2
        working-directory: jarvis2
        run: |
          mkdir -p app/libs
          cp "../${{ steps.locate.outputs.aar_path }}" app/libs/llamatik-bonsai-release.aar
          git config user.name "Jarvis Bonsai Build Bot"
          git config user.email "jarvis-bonsai-bot@local"
          git checkout -b ci/bonsai-aar
          git add app/libs/llamatik-bonsai-release.aar
          git commit -m "Llamatik AAR (Android, fork PrismML branche prism, CPU/NEON, arm64-v8a) construite depuis les sources v1.10.1"
          git push --force origin HEAD:ci/bonsai-aar
