name: Build Llamatik (Vulkan)

# Construit une AAR Android de Llamatik depuis les SOURCES (soumodule
# llama.cpp inclus) avec le backend GPU Vulkan active (-DGGML_VULKAN=ON,
# supporte depuis Llamatik v1.10.1 / PR #169 -- voir CONTRIBUTING.md du
# depot ferranpons/llamatik). L'AAR prebuilt sur Maven Central est
# CPU-only ; c'est le seul moyen d'obtenir un backend GPU sur Android avec
# cette librairie (voir ai/DeviceCapabilities.kt pour le contexte complet).
#
# Volontairement SEPARE du CI principal (android-ci.yml) : une compilation
# C++ complete de llama.cpp/ggml prend bien plus longtemps qu'un simple
# assemblage Gradle, donc ce workflow ne tourne que sur declenchement manuel
# (bouton "Run workflow"), jamais a chaque push.
#
# Restreint a l'ABI arm64-v8a uniquement (patch du build.gradle.kts de
# Llamatik avant compilation) : c'est la seule architecture pertinente pour
# des telephones recents (minSdk 26 = Android 8+), et batir aussi
# armeabi-v7a/x86/x86_64 quadruplerait le temps de compilation C++ pour un
# gain nul sur les appareils cibles.
#
# Le resultat est commite directement sur une branche dediee (jamais main)
# via GITHUB_TOKEN -- a fusionner manuellement une fois l'AAR verifiee.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-vulkan-aar:
    name: Build Llamatik Android AAR (Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Jarvis2
        uses: actions/checkout@v4
        with:
          path: jarvis2

      - name: Checkout Llamatik (with submodules)
        uses: actions/checkout@v4
        with:
          repository: ferranpons/llamatik
          ref: v1.10.1
          submodules: recursive
          path: llamatik-src

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses (NDK auto-provisioning)
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Vulkan SDK (LunarG) -- fournit glslc + les configs CMake SPIRV-Headers/SPIRV-Tools
        # Le simple paquet apt "glslc" ne suffit pas : ggml-vulkan (CMakeLists.txt de
        # llama.cpp/ggml/src/ggml-vulkan) fait aussi find_package(SPIRV-Headers) et
        # find_package(SPIRV-Tools) pour son outil host vulkan-shaders-gen, et ces
        # fichiers de config CMake ne sont pas fournis par les paquets Ubuntu standards
        # (glslang-tools/shaderc) -- c'est la cause exacte de l'echec du run precedent
        # ("Could not find a package configuration file provided by SPIRV-Headers").
        # Le SDK LunarG fournit tout ca ensemble avec les *Config.cmake attendus ; c'est
        # aussi ce qu'utilise le CI officiel de ggml-org/llama.cpp pour son build Vulkan.
        run: |
          set -e
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          UBUNTU_CODENAME=$(lsb_release -cs)
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${UBUNTU_CODENAME}.list "https://packages.lunarg.com/vulkan/lunarg-vulkan-${UBUNTU_CODENAME}.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          which glslc && glslc --version

      - name: Restrict native build to arm64-v8a only (faster CI build)
        run: |
          sed -i 's/abiFilters += setOf("arm64-v8a", "armeabi-v7a", "x86_64", "x86")/abiFilters += setOf("arm64-v8a")/' llamatik-src/library/build.gradle.kts
          grep -n "abiFilters" llamatik-src/library/build.gradle.kts

      - name: Build Llamatik Android library AAR with Vulkan backend
        working-directory: llamatik-src
        # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH est indispensable ici : le toolchain
        # CMake du NDK Android (android.toolchain.cmake) force ce mode a ONLY par defaut,
        # ce qui restreint find_package(...) au seul sysroot NDK et l'empeche de voir les
        # paquets installes cote hote (ex: SPIRV-Headers/SPIRV-Tools fournis par le SDK
        # Vulkan LunarG installe a l'etape precedente) -- meme quand ils sont bien presents
        # sur la machine. ggml-vulkan a besoin de ces paquets hote pour compiler son outil
        # vulkan-shaders-gen, qui tourne sur le build host (pas sur Android) durant la
        # compilation croisee. BOTH autorise la recherche a la fois dans le sysroot NDK et
        # dans les chemins systeme standards, sans quoi le configure CMake echoue avec
        # "Could not find a package configuration file provided by SPIRV-Headers".
        # INCLUDE=BOTH et LIBRARY=BOTH sont necessaires en plus : find_package(Vulkan)
        # est en mode MODULE (FindVulkan.cmake fourni par CMake, pas un Config package),
        # donc pas couvert par PACKAGE=BOTH -- il utilise find_path/find_library, restes
        # a ONLY (sysroot NDK) par defaut. Le NDK fournit vulkan/vulkan.h (API C) mais pas
        # vulkan/vulkan.hpp (bindings C++ que ggml-vulkan.cpp inclut), qui vient du SDK
        # Vulkan hote -- d'ou "fatal error: vulkan/vulkan.hpp file not found" sans ce flag.
        #
        # INCLUDE=BOTH s'est revele INSUFFISANT (meme erreur persistante sur les runs
        # suivants, verifie via les logs bruts CI) : BOTH ajoute simplement le chemin hote
        # comme option de recherche SUPPLEMENTAIRE, il ne le priorise pas. Or find_path()
        # pour vulkan/vulkan.h reussit DEJA trivialement dans le sysroot du NDK (qui est
        # toujours le chemin racine principal, quel que soit FIND_ROOT_PATH_MODE) --
        # celui-ci fournit bien vulkan/vulkan.h (pour lier libvulkan.so d'Android) mais PAS
        # vulkan/vulkan.hpp. Comme find_path() s'arrete au premier repertoire ou le header
        # recherche existe, il retourne le repertoire du NDK et ne va jamais chercher plus
        # loin cote hote -- meme avec BOTH. On force donc directement la variable de cache
        # CMake Vulkan_INCLUDE_DIR vers /usr/include (ou le SDK LunarG installe ses headers,
        # y compris vulkan.hpp), ce qui court-circuite entierement l'auto-detection
        # find_path() plutot que d'essayer de l'influencer.
        run: ./gradlew :library:assembleRelease -Pllamatik.cmake.args="-DGGML_VULKAN=ON -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DVulkan_INCLUDE_DIR=/usr/include" --stacktrace

      - name: Locate the built AAR
        id: locate
        run: |
          AAR_PATH=$(find llamatik-src/library/build/outputs/aar -name "*.aar" | head -n 1)
          if [ -z "$AAR_PATH" ]; then
            echo "::error::Aucune AAR trouvee sous llamatik-src/library/build/outputs/aar"
            exit 1
          fi
          echo "aar_path=$AAR_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$AAR_PATH"

      - name: Upload AAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamatik-vulkan-aar
          path: ${{ steps.locate.outputs.aar_path }}
          retention-days: 30

      - name: Commit AAR to a dedicated branch in Jarvis2
        working-directory: jarvis2
        run: |
          mkdir -p app/libs
          cp "../${{ steps.locate.outputs.aar_path }}" app/libs/llamatik-vulkan-release.aar
          git config user.name "Jarvis Vulkan Build Bot"
          git config user.email "jarvis-vulkan-bot@local"
          git checkout -b ci/vulkan-aar
          git add app/libs/llamatik-vulkan-release.aar
          git commit -m "Llamatik AAR (Android, Vulkan backend, arm64-v8a) construite depuis les sources v1.10.1 -DGGML_VULKAN=ON"
          git push --force origin HEAD:ci/vulkan-aar
