name: Android CI

# Builds Jarvis2 on GitHub's own runners instead of a local/sandboxed
# machine — full network access to Google Maven/Maven Central, no disk or
# file-size constraints, and every push gets a fresh, reproducible build.
#
# - Any push/PR to main: compiles + assembles a debug APK, uploaded as a
#   downloadable workflow artifact (Actions tab -> the run -> Artifacts).
# - A pushed tag like `v0.1.0`: additionally builds a minified, shrunk
#   release APK and attaches it to an auto-created GitHub Release — but
#   only if signing secrets are configured (see "Signing a release" below);
#   otherwise that job is skipped, the debug build still runs fine.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  release-build:
    name: Build & publish signed release APK
    needs: debug-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release signing secrets are configured
        id: signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set — skipping the signed release build. See README's 'Signing a release' section."
          fi

      - name: Set up JDK 21
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with dependency caching)
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: steps.signing.outputs.configured == 'true'
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        if: steps.signing.outputs.configured == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Create GitHub Release with the APK attached
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
